schema_version: 1
name: final-density
experiment: connection_density
sut:
  broker: nats
  profile: fast
  mode: clean
  image_digest: ''
clients:
  producers: 10
  consumers: 10
  active_producers: 1
  active_consumers: 1
traffic:
  model: open_loop
  total_rate_messages_per_sec: 100
  payload_bytes: 256
  consumer_delay_ms: 0
  queue_capacity: 64
  rate_tolerance: 0.05
  burst_multiplier: 1
  burst_every_seconds: 0
  burst_duration_seconds: 0
topology:
  type: many_to_many
  channels: 1
  delivery: broadcast
connection:
  ramp_clients_per_second: 500
  timeout_seconds: 600
  operation_timeout_ms: 2000
timing:
  warmup_seconds: 60
  measurement_seconds: 300
  cooldown_seconds: 30
collection:
  system_interval_ms: 1000
  latency_histograms: true
  operation_samples: false
  max_intervals: 100000
repetitions: 5
random_seed: 42
fault:
  at_seconds: 0
  fraction: 0
  downtime_seconds: 0
  repeat_seconds: 0
matrix:
  axis: clients
  values:
  - 100
  - 1000
  - 5000
  - 10000
  - 25000
  - 50000
