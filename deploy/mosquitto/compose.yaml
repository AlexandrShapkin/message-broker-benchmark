services:
  broker:
    image: ${BENCH_IMAGE:-eclipse-mosquitto:2.0.22@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c}
    ports: ["127.0.0.1:1883:1883"]
    volumes:
      - ../../configs/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "health", "-m", "ready", "-q", "1"]
      interval: 24h
      start_period: 120s
      start_interval: 1s
      timeout: 2s
      retries: 120
    ulimits:
      nofile: {soft: 262144, hard: 262144}
volumes:
  data: {}
