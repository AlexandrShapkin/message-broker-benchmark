[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "broker-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.25.1", "numpy==2.3.4", "matplotlib==3.10.7", "pyarrow==22.0.0"]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3", "mypy==1.18.2", "types-PyYAML==6.0.12.20250915", "types-jsonschema==4.25.1.20251009", "pyarrow-stubs==20.0.0.20260819"]
[project.scripts]
broker-analysis = "broker_analysis.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 110
[tool.mypy]
ignore_missing_imports = true
