name: correctness
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: make bootstrap
      - run: make test lint validate
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: make bootstrap smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-smoke-only
          path: |
            results/
            analysis/output/
            analysis/smoke-output/
